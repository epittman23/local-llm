# Postgres + pgvector for the Open WebUI fork (open-web-ui/openwebui, a git
# submodule pinned to v0.11.3 -- see docs/CLAUDE.md's decisions log). Open
# WebUI itself is no longer a container: it runs as two host processes
# (lllm-frontend, lllm-backend -- scripts/shell/main.sh), the same way
# lllm-serve/lllm-web already do, so it can eventually integrate directly
# with them. Postgres has no such constraint, so it stays the simplest
# option: containerized.
#
# lllm-backend (scripts/shell/main.sh) brings this up before starting the
# backend and tears it down via a trap when the backend stops -- there is
# normally no need to run `docker compose up` by hand. `.env` beside this
# file supplies POSTGRES_PASSWORD.
services:
  postgres:
    image: pgvector/pgvector:pg16   # verify exact tag availability at implementation time
    container_name: local-llm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openwebui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in open-web-ui/.env}
      POSTGRES_DB: openwebui
    ports:
      # Published to loopback only: the consumer is lllm-backend, a host
      # process reaching this via localhost, not a sibling container on a
      # Docker network -- nothing else needs to reach this port.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
