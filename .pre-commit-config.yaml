# The one place linting and formatting are defined. It runs on every
# `git commit` once installed:
#
#   uv tool install pre-commit && pre-commit install
#   (cd apps/web && bun install)   # the Biome hook runs apps/web's own Biome
#
# CI's `pre-commit` job (.github/workflows/ci.yml) runs this same file with
# `--all-files`, so a skipped hook (`git commit --no-verify`) is still caught
# before merge. Run it yourself with `pre-commit run --all-files`.
#
# Rolling out in stages (docs/decisions.md, 2026-10-09). Formatting covers all
# of apps/web and apps/server/backend. Linting does not yet:
#   - ruff-check covers only backend/open_webui/benchmarks/ and tests/ until
#     the rest of the backend's ~2.8k existing findings are fixed;
#   - Biome only formats until apps/web's ~800 existing lint findings are
#     fixed, then the hook becomes `biome check --write --error-on-warnings`.
# Both are temporary gaps being closed, not boundaries: all of this code is
# this repo's own.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # Commit on a branch and open a PR; the ruleset blocks pushing to main
      # anyway, this just says so before the commit instead of after.
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml

  # Scans the staged diff for API keys, tokens and passwords
  # (infra/.env holds real ones and must never be committed).
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^apps/server/backend/(open_webui/benchmarks|tests)/
      - id: ruff-format
        files: ^apps/server/backend/

  # Biome from apps/web/node_modules, so the hook, CI and the editor all run
  # the exact version package.json pins (Dependabot keeps it current). Runs
  # from apps/web so biome.jsonc applies; paths arrive repo-relative and are
  # stripped of the apps/web/ prefix.
  - repo: local
    hooks:
      - id: biome
        name: biome (apps/web)
        language: system
        files: ^apps/web/
        entry: >-
          bash -c 'cd apps/web
          && { [ -x node_modules/.bin/biome ] || { echo "biome missing: run bun install in apps/web" >&2; exit 1; }; }
          && exec node_modules/.bin/biome format --write --no-errors-on-unmatched --files-ignore-unknown=true "${@/#apps\/web\//}"' --
