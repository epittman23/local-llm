# The one place linting and formatting are defined. It runs on every
# `git commit` once installed:
#
#   uv tool install pre-commit && pre-commit install
#   (cd apps/web && bun install)       # the Biome hooks run each app's own Biome
#   (cd apps/desktop && bun install)
#
# CI's `pre-commit` job (.github/workflows/ci.yml) runs this same file with
# `--all-files`, so a skipped hook (`git commit --no-verify`) is still caught
# before merge. Run it yourself with `pre-commit run --all-files`.
#
# ruff-check covers the whole backend (since 2026-10-17). Biome lints
# apps/web against biome-baseline.json (since 2026-10-23): the ~750 findings
# inherited from upstream are allowed and may only shrink, and any new one
# fails (.github/scripts/lint_ratchet.py). Once the baseline is empty the
# hook becomes `biome check --write --error-on-warnings`. That is a temporary
# gap being closed, not a boundary: all of this code is this repo's own.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # Commit on a branch and open a PR; the ruleset blocks pushing to main
      # anyway, this just says so before the commit instead of after.
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
        # uv.lock is generated; CI's `uv lock --check` validates it.
        exclude: ^apps/server/uv\.lock$

  # Scans the staged diff for API keys, tokens and passwords
  # (infra/.env holds real ones and must never be committed). It only sees
  # staged changes, so under `--all-files` on a clean checkout it scans
  # nothing: CI and `make lint` skip it, and CI's "Secrets (gitleaks)" job
  # (`make secrets`) scans the commits themselves instead.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # The version uv.lock pins for the dev group's ruff, so the hook and the
    # editor agree; bump both together.
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e # v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(apps/server/(local_llm|tests)|\.github/scripts)/
      - id: ruff-format
        files: ^(apps/server/(local_llm|tests)|\.github/scripts)/

  # Biome from apps/web/node_modules, so the hook, CI and the editor all run
  # the exact version package.json pins (Dependabot keeps it current). Runs
  # from apps/web so biome.jsonc applies; paths arrive repo-relative and are
  # stripped of the apps/web/ prefix.
  - repo: local
    hooks:
      - id: biome
        name: biome (apps/web)
        language: system
        files: ^apps/web/
        entry: >-
          bash -c 'cd apps/web
          && { [ -x node_modules/.bin/biome ] || { echo "biome missing: run bun install in apps/web" >&2; exit 1; }; }
          && exec node_modules/.bin/biome format --write --no-errors-on-unmatched --files-ignore-unknown=true "${@/#apps\/web\//}"' --
      # Biome's linter over all of apps/web, held to biome-baseline.json.
      - id: biome-lint-ratchet
        name: biome lint (apps/web) against its baseline
        language: system
        files: ^apps/web/
        pass_filenames: false
        entry: >-
          bash -c 'cd apps/web
          && { [ -x node_modules/.bin/biome ] || { echo "biome missing: run bun install in apps/web" >&2; exit 1; }; }
          && report="$(mktemp)" && trap "rm -f \"$report\"" EXIT
          && { node_modules/.bin/biome lint --reporter=json --max-diagnostics=none . > "$report" || true; }
          && python3 ../../.github/scripts/lint_ratchet.py check biome "$report" biome-baseline.json --prefix apps/web'
      # The same for apps/desktop, which lints as well as formats: it has no
      # backlog of findings to work through first.
      - id: biome-desktop
        name: biome (apps/desktop)
        language: system
        files: ^apps/desktop/
        entry: >-
          bash -c 'cd apps/desktop
          && { [ -x node_modules/.bin/biome ] || { echo "biome missing: run bun install in apps/desktop" >&2; exit 1; }; }
          && exec node_modules/.bin/biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true "${@/#apps\/desktop\//}"' --

  # The workflows themselves: actionlint for syntax, expressions and the
  # shellcheck of every `run:` block (the Docker image bundles shellcheck, so
  # a machine without it checks the same as CI), zizmor for security
  # (template injection, untrusted checkouts, over-broad permissions).
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint-docker
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # v1.30.1
    hooks:
      - id: zizmor
        args: [--offline]

  - repo: local
    hooks:
      # AGENTS.md's maintenance policy: docs/roadmap-timeline.mmd is the
      # canonical timeline and docs/ROADMAP.md embeds a byte-identical copy.
      - id: roadmap-timeline
        name: roadmap timeline matches its copy in ROADMAP.md
        language: system
        files: ^docs/(roadmap-timeline\.mmd|ROADMAP\.md)$
        pass_filenames: false
        entry: python3 .github/scripts/check_roadmap_timeline.py
      # pr_gate.py runs from main under pull_request_target, so a PR that
      # changes it never runs its own copy: these tests are its only check
      # before it merges.
      - id: pr-gate-tests
        name: PR gate unit tests
        language: system
        files: ^\.github/scripts/
        pass_filenames: false
        entry: python3 -m unittest discover -s .github/scripts -q
