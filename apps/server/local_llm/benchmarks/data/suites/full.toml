# Every item of every benchmark. The only tier whose pass rate means the same
# thing as a published one -- and the only tier where a difference from a
# published figure is evidence about this setup rather than about sampling.
#
# Cost on this hardware: 164 + 378 + 511 items (less what calibration
# excludes) at roughly 3 t/s with reasoning tokens dominating. Budget days,
# not hours, and expect to resume it.

id   = "full"
description = "every item; the only tier comparable to a published score"
name = "full"
seed = 20260830
note = "complete sets; the only tier comparable to published pass@1"

[[benchmark]]
id = "humanevalplus"
n  = 0          # 0 = every item that survives the adapter's filter

[[benchmark]]
id = "mbppplus"
n  = 0

[[benchmark]]
id = "ds1000"
n  = 0

# Only with a release-date window (the Tests page's window dates): without
# one, a run leaves LiveCodeBench out and says so. A window smaller than n
# uses every problem in it.
[[benchmark]]
id = "livecodebench"
n  = 0
