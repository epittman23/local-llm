# An overnight run. Wide enough that a few items moving does not swing the
# result, still a sample rather than the benchmark: a published pass@1 is over
# the complete set, so these numbers compare configurations with each other and
# nothing else.

id   = "standard"
description = "an overnight run; enough items to separate configurations"
name = "standard"
seed = 20260830
note = "seeded sample; compare between configs, not against published scores"

[[benchmark]]
id = "humanevalplus"
n  = 100

[[benchmark]]
id = "mbppplus"
n  = 100

[[benchmark]]
id = "ds1000"
n  = 100

# Only with a release-date window (the Tests page's window dates): without
# one, a run leaves LiveCodeBench out and says so. A window smaller than n
# uses every problem in it.
[[benchmark]]
id = "livecodebench"
n  = 100
