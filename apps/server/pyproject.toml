requires-python = ">= 3.12, < 3.13.0a1"
version = "0.11.3"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia",
]

[project.optional-dependencies]
unstructured = [
    "unstructured==0.27.25",
]

# Every optional backend the inherited code supports and this install doesn't use.
# qdrant-client and pymilvus serve external knowledge connections (querying
# someone else's Qdrant or Milvus), not this install's own vector store. Each is imported lazily, only when configured, so
# leaving them out of the default install just keeps their code (and their
# vulnerabilities) off the machine. `uv sync --extra all` brings them back.
# Without `unstructured`, RAG uploads of .rst/.xml files report it missing;
# Excel and PowerPoint fall back to pandas / python-pptx.
all = [
    "pymongo==4.18.3",
    "playwright==1.63.0",

    "qdrant-client==1.19.1",
    
    "pymilvus==3.0.2",
    "colbert-ai==0.2.22",

    "azure-search-documents==12.0.0",
    "unstructured==0.27.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["local_llm"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

# The single source of the backend's dependencies is this file plus uv.lock;
# `make backend` and CI both run `uv sync --frozen` against them.
[tool.uv]
environments = ["sys_platform == 'linux'"]
# colbert-ai (in the `all` extra) requires `datasets` with no lower bound;
# below 5.0.1 its folder-based builders allow path traversal
# (GHSA-379c-qx7v-6h59).
constraint-dependencies = ["datasets>=5.0.1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# Coverage for CI's diff-coverage check (diff-cover on the lines a pull
# request changes; docs/guides/testing.md). Applied migrations are
# generated, and they run in subprocesses (test_imports, test_schema_drift,
# the boot smoke) that coverage doesn't follow.
[tool.coverage.run]
source = ["local_llm"]
omit = ["local_llm/migrations/versions/*"]
relative_files = true

[tool.ruff]
line-length = 120
# Generated code is not linted or formatted. Applied Alembic migrations are
# generated by `alembic revision` and, once applied, never edited (the
# schema is append-only). force-exclude makes this hold when pre-commit
# passes a file by name, not only when ruff walks the tree.
extend-exclude = ["local_llm/migrations/versions"]
force-exclude = true

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "C90",  # mccabe
  "Q",    # flake8-quotes
  "ICN",  # flake8-import-conventions
]

# Plugin configs:
flake8-import-conventions.banned-from = [ "ast", "datetime" ]
flake8-import-conventions.aliases = { datetime = "dt" }
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 25
pydocstyle.convention = "google"
