requires-python = ">= 3.12, < 3.13.0a1"
version = "0.11.3"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia",
]

[project.optional-dependencies]
mariadb = [
    "mariadb==1.1.14",
]
unstructured = [
    "unstructured==0.27.16",
]

# Every optional backend Open WebUI supports and this install doesn't use
# (it runs on pgvector). Each is imported lazily, only when configured, so
# leaving them out of the default install just keeps their code (and their
# vulnerabilities) off the machine. `uv sync --extra all` brings them back.
# Without `unstructured`, RAG uploads of .rst/.xml files report it missing;
# Excel and PowerPoint fall back to pandas / python-pptx.
all = [
    "pymongo==4.18.2",
    "playwright==1.63.0",
    "elasticsearch==9.5.1",

    "qdrant-client==1.19.1",
    
    "weaviate-client==4.23.1",
    "pymilvus==3.0.2",
    "pinecone==10.0.0",
    "oracledb==26.0.1",
    "colbert-ai==0.2.22",

    "azure-search-documents==12.0.0",
    "unstructured==0.27.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
sources = ["backend"]
exclude = [
    ".gitignore",
    "webui.db",
    "chroma.sqlite3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.5",
]

# The single source of the backend's dependencies is this file plus uv.lock;
# `make backend` and CI both run `uv sync --frozen` against them.
[tool.uv]
environments = ["sys_platform == 'linux'"]
# colbert-ai (in the `all` extra) requires `datasets` with no lower bound;
# below 5.0.1 its folder-based builders allow path traversal
# (GHSA-379c-qx7v-6h59).
constraint-dependencies = ["datasets>=5.0.1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "C90",  # mccabe
  "Q",    # flake8-quotes
  "ICN",  # flake8-import-conventions
]

# Plugin configs:
flake8-import-conventions.banned-from = [ "ast", "datetime" ]
flake8-import-conventions.aliases = { datetime = "dt" }
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 10
pydocstyle.convention = "google"

# This repo's own backend code (benchmarks/ and tests/) is linted in
# pre-commit and CI; the rest of open_webui/ is upstream Open WebUI and is
# not. Complexity is exempt there: its long report/stats functions read
# top to bottom on purpose, and splitting them for a branch count is churn.
[tool.ruff.lint.per-file-ignores]
"backend/open_webui/benchmarks/**" = ["C901"]
"backend/tests/**" = ["C901"]
