# R for the data image, from conda-forge, installed into the base conda
# environment by Dockerfile.data (`mamba env update`). Resolved 2026-11-11
# against scipy-notebook:2026-10-12; bump together with the image tag.
channels:
  - conda-forge
dependencies:
  - r-base=4.5.3
  - r-tidyverse=2.0.0
  - r-data.table=1.18.6.1
  - r-broom=1.0.13
  - r-lme4=2.0_6
  - r-survival=3.8_12
