# The sandbox mirror's whole configuration (infra/docker-compose.yml,
# `sandbox-mirror`). It serves one directory, read-only, as an index of files:
# pip's `--find-links` reads the listing. It runs as UID 101 on port 8000, so
# it needs no Linux capability, and every path it writes is under /tmp (a
# tmpfs). There is no proxy, no upstream and no other location.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Any sandbox can open connections here. limit_conn bounds the concurrent
    # requests per sandbox address (a sandbox cannot spoof one), but it counts
    # only once a request's header is read, so a sandbox can still hold many
    # half-open sockets until the header timeout closes them. The short
    # timeouts and a large worker_connections bound that; they do not
    # eliminate it.
    limit_conn_zone $binary_remote_addr zone=per_sandbox:1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    max_ranges 1;
    disable_symlinks on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # One JSON object per request, on stdout, for `docker logs` and for the
    # package telemetry (T21) to read.
    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    server {
        listen 8000;
        limit_conn per_sandbox 8;
        location / {
            root /usr/share/nginx/html;
            autoindex on;
            limit_except GET HEAD {
                deny all;
            }
        }
    }
}
