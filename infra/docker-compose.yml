# Postgres + pgvector, and Redis, for the backend (apps/server). The backend itself is not
# a container: it runs as a host process so it can start and stop
# llama-server on this machine's GPU. Postgres has no such constraint, so it
# stays the simplest option: containerized.
#
# `make backend` brings this up before starting the backend and tears it
# down via a trap when the backend stops -- there is normally no need to run
# `docker compose up` by hand. `.env` beside this file supplies
# POSTGRES_PASSWORD.
#
# The project name is pinned rather than inherited from this file's parent
# directory. Compose derives it from the directory by default, and the
# volume name from the project name, so moving or renaming this directory
# would silently orphan the data volume and bring the backend up against an
# EMPTY database. With the pin, the volume is always local-llm_postgres-data.
# Do not change this value without moving the data deliberately.
#
# History: the project was pinned as `open-web-ui` from 2026-09-14, and its
# volume was open-web-ui_postgres-data. It was renamed to `local-llm` on
# 2026-10-10, when no volume existed on this machine, so the new volume starts
# empty; a database from the old volume comes back by pg_dump/pg_restore (see
# README.md, "Running it").
name: local-llm

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: local-llm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: local_llm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: local_llm
    ports:
      # Published to loopback only: the consumer is the backend, a host
      # process reaching this via localhost, not a sibling container on a
      # Docker network -- nothing else needs to reach this port.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Required since 2026-10-19: session revocation (sign-out, password changes,
  # admin resets) is stored here, and without it a revoked session stayed
  # valid until it expired. Append-only persistence, because a restart that
  # forgot the revocations would bring those sessions back. Loopback only,
  # for the same reason as Postgres.
  redis:
    image: redis:7.4.2-alpine
    container_name: local-llm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  # The code interpreter's engine (Admin Settings > Code Execution: Jupyter).
  # The backend reaches it on loopback and runs each code block in a fresh
  # kernel, which it deletes afterwards. It runs code a model wrote, so it is
  # fenced in: its own network (it cannot reach Postgres or Redis by name),
  # no Linux capabilities, no privilege escalation, and memory and process
  # caps. It keeps internet access so `pip install` works; set
  # `internal: true` on the `jupyter` network below to cut that off.
  # Terminals are off. Idle kernels are culled after 10 minutes, in case
  # one is left behind. Each code block runs in its own lllm-uploads/<run>/
  # directory, holding the chat's attached files, deleted with the block.
  jupyter:
    image: quay.io/jupyter/scipy-notebook:2026-10-12
    container_name: local-llm-jupyter
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?set JUPYTER_TOKEN in infra/.env}
    command:
      - start-notebook.py
      - --ServerApp.terminals_enabled=False
      - --MappingKernelManager.cull_idle_timeout=600
      - --MappingKernelManager.cull_interval=120
      # The backend copies a chat's files into a directory per run and
      # deletes it afterwards, outputs included: allow deleting a non-empty
      # directory, and skip the trash, which would keep the copies.
      - --FileContentsManager.always_delete_dir=True
      - --FileContentsManager.delete_to_trash=False
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - jupyter-work:/home/jovyan/work
    networks: [jupyter]
    mem_limit: 4g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Private web search (Admin Settings > Web Search: searxng, query URL
  # http://127.0.0.1:8080/search?q=<query>). It needs no API key, but it is
  # a metasearch engine: queries still go to the upstream engines it asks
  # (Google, DuckDuckGo, ...), from this machine's IP, with no account or
  # cookie attached. searxng/settings.yml turns on the JSON output the
  # backend reads; the secret comes from infra/.env.
  searxng:
    image: searxng/searxng:2026.10.17-1c10abe2d
    container_name: local-llm-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in infra/.env}
      SEARXNG_SETTINGS_PATH: /config/settings.yml
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/config/settings.yml:ro
    networks: [searxng]
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]

# Postgres and Redis share the default network. Jupyter and SearXNG get one
# each, so neither can reach anything else by service name.
networks:
  jupyter:
  searxng:

volumes:
  postgres-data:
  redis-data:
  jupyter-work:
