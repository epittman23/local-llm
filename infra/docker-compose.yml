# Postgres + pgvector, and Redis, for the backend (apps/server). The backend itself is not
# a container: it runs as a host process so it can start and stop
# llama-server on this machine's GPU. Postgres has no such constraint, so it
# stays the simplest option: containerized.
#
# `make backend` brings this up before starting the backend and tears it
# down via a trap when the backend stops -- there is normally no need to run
# `docker compose up` by hand. `.env` beside this file supplies
# POSTGRES_PASSWORD.
#
# The project name is pinned rather than inherited from this file's parent
# directory. Compose derives it from the directory by default, and the
# volume name from the project name, so moving or renaming this directory
# would silently orphan the data volume and bring the backend up against an
# EMPTY database. With the pin, the volume is always local-llm_postgres-data.
# Do not change this value without moving the data deliberately.
#
# History: the project was pinned as `open-web-ui` from 2026-09-14, and its
# volume was open-web-ui_postgres-data. It was renamed to `local-llm` on
# 2026-10-10, when no volume existed on this machine, so the new volume starts
# empty; a database from the old volume comes back by pg_dump/pg_restore (see
# README.md, "Running it").
name: local-llm

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: local-llm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: local_llm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: local_llm
    ports:
      # Published to loopback only: the consumer is the backend, a host
      # process reaching this via localhost, not a sibling container on a
      # Docker network -- nothing else needs to reach this port.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # What `make backend` waits on (`up --wait`) before starting the backend,
    # which runs its migrations at import. Over TCP: on a fresh volume the
    # image's init step first runs a temporary server on the Unix socket only.
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "local_llm", "-d", "local_llm"]
      # Failures in the first 60 s don't count (a fresh volume's init), then
      # 30 more probes: about the 120 s `make backend` waits at most.
      start_period: 60s
      interval: 2s
      timeout: 5s
      retries: 30

  # Required since 2026-10-19: session revocation (sign-out, password changes,
  # admin resets) is stored here, and without it a revoked session stayed
  # valid until it expired. Append-only persistence, because a restart that
  # forgot the revocations would bring those sessions back. Loopback only,
  # for the same reason as Postgres.
  redis:
    image: redis:7.4.2-alpine
    container_name: local-llm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  # The code interpreter's engine (Admin Settings > Code Execution: Jupyter).
  # The backend reaches it on loopback and runs each code block in a fresh
  # kernel, which it deletes afterwards. It runs code a model wrote, so it is
  # fenced in: its own network (it cannot reach Postgres or Redis by name),
  # no Linux capabilities, no privilege escalation, and memory and process
  # caps. It keeps internet access so `pip install` works; set
  # `internal: true` on the `jupyter` network below to cut that off.
  # Terminals are off. Idle kernels are culled after 10 minutes, in case
  # one is left behind. Each code block runs in its own lllm-uploads/<run>/
  # directory, holding the chat's attached files, deleted with the block.
  jupyter:
    image: quay.io/jupyter/scipy-notebook:2026-10-12
    container_name: local-llm-jupyter
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?set JUPYTER_TOKEN in infra/.env}
    command:
      - start-notebook.py
      - --ServerApp.terminals_enabled=False
      - --MappingKernelManager.cull_idle_timeout=600
      - --MappingKernelManager.cull_interval=120
      # The backend copies a chat's files into a directory per run and
      # deletes it afterwards, outputs included: allow deleting a non-empty
      # directory, and skip the trash, which would keep the copies.
      - --FileContentsManager.always_delete_dir=True
      - --FileContentsManager.delete_to_trash=False
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - jupyter-work:/home/jovyan/work
    networks: [jupyter]
    mem_limit: 4g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Private web search (Admin Settings > Web Search: searxng, query URL
  # http://127.0.0.1:8080/search?q=<query>). It needs no API key, but it is
  # a metasearch engine: queries still go to the upstream engines it asks
  # (Google, DuckDuckGo, ...), from this machine's IP, with no account or
  # cookie attached. searxng/settings.yml turns on the JSON output the
  # backend reads; the secret comes from infra/.env.
  searxng:
    image: searxng/searxng:2026.10.17-1c10abe2d
    container_name: local-llm-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in infra/.env}
      SEARXNG_SETTINGS_PATH: /config/settings.yml
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/config/settings.yml:ro
    networks: [searxng]
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]

  # The code sandbox's package mirror (docs/guides/sandbox.md "Mirror and
  # wheelhouse"). A sandbox has no route to the internet; its `pip install`
  # reads this one file index (PIP_FIND_LINKS=http://sandbox-mirror:8000/),
  # which lists only the wheels `make wheelhouse` downloaded for the allowlist
  # (infra/sandbox/allowlist.in), by hash. The mirror is on the internal
  # `sandbox` network only: it cannot reach PyPI or anything else, so a wheel
  # arrives only through `make wheelhouse`, which runs on the host. Nothing
  # but sandboxes reaches it: no published port, the wheelhouse mounted
  # read-only, a read-only root, UID 101 on port 8000 (so no capability, not
  # even NET_BIND_SERVICE), no privilege escalation, and memory and process
  # caps. Names do not resolve inside a Kata guest, so the address is fixed
  # and the backend passes it as `extra_hosts` (the subnet, range and address
  # are constants in apps/server/local_llm/sandbox/kata.py; a test checks they
  # agree with this file). `make backend` creates the wheelhouse directory and
  # sets LLLM_SANDBOX_WHEELHOUSE from DATA_DIR (a hand-run `docker compose up`
  # without it serves apps/server/data/sandbox/wheelhouse, and Docker makes a
  # missing directory root-owned: run `make wheelhouse` first, or `mkdir`).
  sandbox-mirror:
    image: nginx:1.30.0-alpine@sha256:0272e4604ed93c1792f03695a033a6e8546840f86e0de20a884bb17d2c924883
    container_name: local-llm-sandbox-mirror
    restart: unless-stopped
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./sandbox/mirror/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LLLM_SANDBOX_WHEELHOUSE:-../apps/server/data/sandbox/wheelhouse}:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      sandbox:
        ipv4_address: 10.231.0.2
    mem_limit: 64m
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Every request is logged, and a sandbox chooses its URI and user agent:
    # without a cap it could fill the host's disk through this log.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 3s
      retries: 3

# Postgres and Redis share the default network. Jupyter and SearXNG get one
# each, so neither can reach anything else by service name.
#
# The sandboxes' network (Compose names it local-llm_sandbox) is `internal`:
# no route out of it to the internet, the LAN or any other Docker network. The
# only peer on it is the mirror, at a fixed address in the lower half of the
# subnet; Docker hands sandboxes addresses from the upper half only
# (`ip_range`), so none can take the mirror's address before it starts. The
# range is outside Docker's default address pools.
#
# The host is the part `internal` does not close. The bridge gets no IPv4
# address (`inhibit_ipv4`, and no `gateway:`), because an address on the
# host's side would let a sandbox reach host listeners bound to 0.0.0.0 (the
# backend in LAN mode, llama-server). The kernel still gives the bridge an
# IPv6 link-local address, which a guest with IPv6 enabled reaches, together
# with host listeners on `::`. Two layers close that: the backend starts every
# sandbox with IPv6 disabled (a sysctl in the guest; sandbox/kata.py), and the
# bridge has a fixed name (`lllm-sandbox`) so a host-side rule can name it
# (a udev rule disables IPv6 on it; docs/guides/sandbox.md "Host setup",
# "No IPv6 on the sandbox bridge"). `docker compose down` with sandboxes attached leaves
# this network ("Resource is still in use"); the next `up` reuses it.
networks:
  jupyter:
  searxng:
  sandbox:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
      com.docker.network.bridge.name: lllm-sandbox
    ipam:
      config:
        - subnet: 10.231.0.0/24
          ip_range: 10.231.0.128/25

volumes:
  postgres-data:
  redis-data:
  jupyter-work:
