# Required check for main: the ruleset requires the `CI passed` job, which
# only succeeds when every job above it did. Each job runs on every PR (no
# `paths:` filters) because a required check that is skipped never reports
# and would leave the PR blocked forever.
#
# Third-party actions are pinned to commit SHAs (tag in the trailing
# comment); Dependabot (.github/dependabot.yml) bumps them.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Daily run on main. Dependabot PRs are auto-merged with GITHUB_TOKEN,
  # and pushes made with that token don't trigger `push` workflows, so
  # without this nothing would re-test main after two bumps that each passed
  # alone but break together.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '26'
  BUN_VERSION: '1.4.2'
  PYTHON_VERSION: '3.12'
  PRE_COMMIT_VERSION: '4.6.2'
  # diff-cover checks coverage of the lines a pull request changes (backend
  # and web jobs). The Makefile's DIFF_COVER_VERSION is the same; so is the
  # bar, DIFF_COVER_FAIL_UNDER (percent of changed, coverable lines).
  DIFF_COVER_VERSION: '10.6.0'
  # The backend's type checker (the `types` job); the Makefile's
  # BASEDPYRIGHT_VERSION is the same. A new version can change what it
  # reports, so bump it by hand and record the baseline with `make baselines`.
  BASEDPYRIGHT_VERSION: '1.40.2'
  DIFF_COVER_FAIL_UNDER: '80'
  # The version .pre-commit-config.yaml's gitleaks hook pins, by digest; the
  # Makefile's GITLEAKS_IMAGE is the same string.
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  pre-commit:
    name: Lint and format (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The Biome hooks run apps/web's and apps/desktop's own pinned Biome.
      - name: bun install (web)
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: bun install (desktop)
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # .pre-commit-config.yaml is the only definition of the lint and
      # format checks. no-commit-to-branch is skipped: it guards local
      # commits, and on a push to main it would fail by design. gitleaks is
      # skipped because its hook scans only staged changes, which a checkout
      # has none of; the `secrets` job below scans the commits instead.
      - name: pre-commit run --all-files
        env:
          SKIP: no-commit-to-branch,gitleaks
        run: uvx "pre-commit@${PRE_COMMIT_VERSION}" run --all-files --show-diff-on-failure --color=always

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A pull request's own commits, so a key committed and then deleted
      # in a later commit is still caught; on main (push, the daily run) the
      # whole history. Known non-secrets are listed in .gitleaksignore.
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range=()
          if [ -n "$BASE_SHA" ]; then range=(--log-opts="$BASE_SHA..$HEAD_SHA"); fi
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$GITLEAKS_IMAGE" \
            git --no-banner --redact --verbose "${range[@]}" /repo

  web:
    name: Web (astro check, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # diff-cover diffs against the base commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: bun install --frozen-lockfile
      - run: bunx astro check
      - run: bun run test:coverage
      # lcov names files relative to apps/web; diff-cover needs them
      # relative to the repository, like git's diff.
      - name: Coverage of the changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          sed 's#^SF:#SF:apps/web/#' coverage/lcov.info > coverage/lcov-repo.info
          cd ../..
          uvx "diff-cover@${DIFF_COVER_VERSION}" apps/web/coverage/lcov-repo.info \
            --compare-branch="$BASE_SHA" --fail-under="$DIFF_COVER_FAIL_UNDER"
      - run: bun run build

  e2e:
    name: Web e2e (Playwright, mocked backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      # The dev server runs detached (`astro dev --background`) and writes
      # only to .astro/dev.log; Playwright discards the stdout that would
      # carry it. Without this, a dev server that dies mid-run leaves no
      # trace of why (run 40119420784: every test from #191 on refused).
      - name: Dev server log (tail)
        if: failure()
        run: tail -n 200 .astro/dev.log || echo "No .astro/dev.log."
      - name: Upload Playwright traces and the dev server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: |
            apps/web/test-results/
            apps/web/.astro/dev.log
          # .astro/ is a hidden directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 7

  desktop:
    name: Desktop (typecheck, vitest, package smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:unit
      # An unpacked package, no .rpm (that needs rpm-build): it catches an
      # electron-builder bump that breaks packaging, which Dependabot would
      # otherwise auto-merge on green.
      - run: bun run package:dir

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/server
    # A throwaway Postgres with pgvector (the image infra/docker-compose.yml
    # runs) for tests/test_imports.py: importing the app connects the default
    # vector store, pgvector.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: local_llm
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: local_llm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U local_llm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Not secrets: the app refuses to import without a key, the tests never
      # serve anything signed with it, and the database exists only for this job.
      LLLM_SECRET_KEY: ci-only-not-a-secret-0123456789abcdef0123456789abcdef
      TEST_DATABASE_URL: postgresql://local_llm:ci-only-not-a-secret@localhost:5432/local_llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # diff-cover diffs against the base commit
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      # Fails if pyproject.toml changed without re-running `uv lock`, so the
      # lock CI installs from is always the one the project declares.
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      # The same install `make backend` does (pyproject.toml + uv.lock,
      # CPU torch), plus the dev group for pytest.
      - name: Install
        run: uv sync --frozen --no-install-project --group dev
      - name: pytest
        run: uv run --frozen python -m pytest tests -q --cov --cov-report=xml
      - name: Coverage of the changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uvx "diff-cover@${DIFF_COVER_VERSION}" coverage.xml \
            --compare-branch="$BASE_SHA" --fail-under="$DIFF_COVER_FAIL_UNDER"

  # basedpyright over the backend, held to apps/server/basedpyright-baseline.json:
  # the inherited findings are allowed, any new one fails
  # (.github/scripts/lint_ratchet.py). It needs the backend's dependencies
  # installed to resolve imports.
  types:
    name: Backend types (basedpyright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - name: Install
        run: uv sync --frozen --no-install-project
      # basedpyright exits non-zero whenever it reports anything; the
      # baseline decides. An empty report means it crashed.
      - name: basedpyright
        run: uvx "basedpyright@${BASEDPYRIGHT_VERSION}" --outputjson > basedpyright.json || [ -s basedpyright.json ]
      - name: Against the baseline
        run: python3 ../../.github/scripts/lint_ratchet.py check basedpyright basedpyright.json basedpyright-baseline.json

  # Starts the real backend, as `make backend` does, and uses it: the pytest
  # suite only imports the app and Playwright mocks it, so nothing else
  # would notice a backend that no longer boots. tests/boot_smoke.py has
  # what it checks. The images are infra/docker-compose.yml's.
  boot:
    name: Boot (real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: local_llm
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: local_llm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U local_llm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LLLM_SECRET_KEY: ci-only-not-a-secret-0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql://local_llm:ci-only-not-a-secret@localhost:5432/local_llm
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      # The backend serves the built frontend at /, so build it first.
      - name: Build the frontend
        working-directory: apps/web
        run: bun install --frozen-lockfile && bun run build
      - name: Install the backend
        working-directory: apps/server
        run: uv sync --frozen --no-install-project
      - name: Boot smoke
        working-directory: apps/server
        run: uv run --frozen python tests/boot_smoke.py

  ci-ok:
    name: CI passed
    if: always()
    needs: [pre-commit, secrets, web, e2e, desktop, backend, types, boot]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          ANY_NOT_SUCCEEDED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "$NEEDS"
          [ "$ANY_NOT_SUCCEEDED" = false ]
